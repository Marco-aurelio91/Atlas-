name: atlas_sdk
description: >
  Cliente leve para o gateway de IA de apps parceiros do Atlas (atlas-sdk) — hoje cobre geração de
  texto (legendas, hashtags, moderação); autenticado por chave de app, não por conta do Atlas.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  http: ^1.2.1

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
