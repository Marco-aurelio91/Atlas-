agp = "9.2.1"
kotlin = "2.4.0"
ksp = "2.3.9"
composeBom = "2026.06.00"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
splashscreen = "1.2.0"
hilt = "2.59.2"
androidxHilt = "1.3.0"
room = "2.8.4"
datastore = "1.2.1"
coroutines = "1.11.0"
coil = "3.5.0"
glance = "1.1.1"
nav3 = "1.1.3"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
truth = "1.4.4"
work = "2.10.1"
playServicesAuth = "21.3.0"
playServicesLocation = "21.4.0"
okhttp = "4.12.0"
orgJson = "20240303"
securityCrypto = "1.1.0-alpha06"
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
